name: Auto Per-File Descriptions
on:
  push:
    branches: [main]
    paths:
      - '**.py'

permissions:
  contents: write

jobs:
  document-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate File Index
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - << 'EOF'
          import os, glob, json, urllib.request

          py_files = sorted(glob.glob("**/*.py", recursive=True))
          if not py_files:
              exit(0)

          code_bundle = ""
          for f in py_files:
              with open(f, "r", encoding="utf-8", errors="ignore") as fp:
                  code_bundle += f"\n--- FILE: {f} ---\n{fp.read()[:4000]}\n"

          prompt = (
              "Create a clean Markdown table with columns 'File' and 'Description' "
              "summarizing what each Python script does in 1-2 sentences:\n"
              + code_bundle
          )

          url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key={os.environ['GEMINI_API_KEY']}"
          req = urllib.request.Request(
              url,
              data=json.dumps({"contents": [{"parts": [{"text": prompt}]}]}).encode(),
              headers={"Content-Type": "application/json"}
          )
          with urllib.request.urlopen(req) as res:
              summary = json.loads(res.read().decode())["candidates"][0]["content"]["parts"][0]["text"]

          with open("FILE_INDEX.md", "w", encoding="utf-8") as out:
              out.write("# Repository File Index\n\n" + summary + "\n")
          EOF

      - name: Commit Updated Index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add FILE_INDEX.md
          git diff --staged --quiet || git commit -m "docs: update per-file descriptions"
          git push
