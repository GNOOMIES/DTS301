name: Auto Per-File & Folder Descriptions
on:
  push:
    branches: [main]
    paths:
      - '**.py'

permissions:
  contents: write

jobs:
  document-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Root Index and Folder READMEs
        env:
          GEMINI_API_KEY: \${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - << 'EOF'
          import os, glob, json, urllib.request
          from collections import defaultdict

          def ask_gemini(prompt):
              url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key={os.environ['GEMINI_API_KEY']}"
              req = urllib.request.Request(
                  url,
                  data=json.dumps({"contents": [{"parts": [{"text": prompt}]}]}).encode(),
                  headers={"Content-Type": "application/json"}
              )
              with urllib.request.urlopen(req) as res:
                  return json.loads(res.read().decode())["candidates"][0]["content"]["parts"][0]["text"]

          py_files = sorted(glob.glob("**/*.py", recursive=True))
          if not py_files:
              exit(0)

          # 1. Update root FILE_INDEX.md (quick overview table)
          all_code = ""
          folders = defaultdict(list)
          for f in py_files:
              with open(f, "r", encoding="utf-8", errors="ignore") as fp:
                  content = fp.read()[:6000]
              all_code += f"\n--- FILE: {f} ---\n{content}\n"
              folder = os.path.dirname(f)
              if folder:
                  folders[folder].append((os.path.basename(f), content))

          index_prompt = (
              "Create a clean Markdown table with columns 'File' and 'Description' "
              "summarizing what each Python script does in 1-2 sentences:\n"
              + all_code
          )
          with open("FILE_INDEX.md", "w", encoding="utf-8") as out:
              out.write("# Repository File Index\n\n" + ask_gemini(index_prompt) + "\n")

          # 2. Generate detailed README.md inside each subfolder
          for folder, files in folders.items():
              folder_bundle = ""
              for fname, content in files:
                  folder_bundle += f"\n--- FILE: {fname} ---\n{content}\n"

              folder_prompt = (
                  f"Write a thorough, well-structured Markdown README for the folder '{folder}'. "
                  "Include:\n"
                  "1. A high-level overview of the topic/module.\n"
                  "2. A detailed section for each Python file explaining every function, task, or class, "
                  "how the logic/algorithms work, and key programming/AI concepts demonstrated.\n"
                  "3. A brief 'How to Run' section.\n"
                  "Return clean Markdown only (no wrapping ```markdown fences):\n"
                  + folder_bundle
              )
              with open(os.path.join(folder, "README.md"), "w", encoding="utf-8") as out:
                  out.write(ask_gemini(folder_prompt) + "\n")
          EOF

      - name: Commit Updated Docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add FILE_INDEX.md "**/README.md"
          git diff --staged --quiet || git commit -m "docs: update file index and folder READMEs"
          git push
